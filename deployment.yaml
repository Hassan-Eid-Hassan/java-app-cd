apiVersion: apps/v1
kind: Deployment
metadata:
    name: java-app
    namespace: java-ns
    labels:
        app: java-app
        tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-app
  template:
    metadata:
      labels:
        app: java-app
    spec:
      containers:
      - name:   java-app
        image: hassaneid/depi-java:v12
        ports:
        - containerPort: 8090